server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 32m;

    location /api/core/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/chat/ {
        proxy_pass http://chat:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://chat:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
    location /admin/ {
        proxy_pass http://core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/core/ { alias /srv/core-static/; }
    location /media/core/ {
        alias /srv/core-media/;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/chat/ { return 404; }
    # Chat media не публикуется: только API с Bearer и проверкой участия.
    location / { try_files $uri $uri/ /index.html; }
}